global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "eloja-api"
    static_configs:
      - targets: ["eloja-api:8080"]
    metrics_path: "/metrics"

  - job_name: "eloja-inventario-worker"
    static_configs:
      - targets: ["eloja-inventario-worker:8081"]
    metrics_path: "/metrics"

  - job_name: "eloja-ordem-worker"
    static_configs:
      - targets: ["eloja-ordem-worker:8082"]
    metrics_path: "/metrics"

  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]
    metrics_path: "/metrics"

services:
  api:
    build:
      context: ./eloja.api
      dockerfile: Dockerfile
    container_name: eloja-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres-db;Port=5432;Database=${POSTGRES_DB:-eloja};Username=${POSTGRES_USER:-dev};Password=${POSTGRES_PASSWORD:-dev}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-dev}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dev}
      RABBITMQ_VHOST: /
      RABBITMQ_SSL_ENABLED: "false"
      Redis__Host: redis
      Redis__Port: 6379
      Redis__Password: ${REDIS_PASSWORD:-dev}
      Jwt__Key: ${JWT_KEY:-CHANGE_ME_INSECURE_DEV_ONLY_KEY_1234567890==}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      OTEL_SERVICE_NAME: eloja-api
    depends_on:
      postgres-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - eloja-network

  inventario-worker:
    build:
      context: ./eloja-inventario-worker
      dockerfile: eloja-inventario-worker/Dockerfile
    container_name: eloja-inventario-worker
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8081
      ConnectionStrings__DefaultConnection: Host=postgres-db;Port=5432;Database=${POSTGRES_DB:-eloja};Username=${POSTGRES_USER:-dev};Password=${POSTGRES_PASSWORD:-dev}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-dev}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dev}
      RABBITMQ_VHOST: /
      RABBITMQ_SSL_ENABLED: "false"
      Redis__Host: redis
      Redis__Port: 6379
      Redis__Password: ${REDIS_PASSWORD:-dev}
      Loki__Url: http://loki:3100
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      OTEL_SERVICE_NAME: eloja-inventario-worker
    depends_on:
      postgres-db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - eloja-network

  ordem-worker:
    build:
      context: ./eloja-ordem-worker
      dockerfile: eloja-ordem-worker/Dockerfile
    container_name: eloja-ordem-worker
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      DOTNET_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8082
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-dev}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dev}
      RABBITMQ_VHOST: /
      RABBITMQ_SSL_ENABLED: "false"
      MONGO_CONN_STR: "mongodb://${MONGO_APP_USER:-dev}:${MONGO_APP_PASSWORD:-dev}@mongodb:27017/eloja?authSource=eloja"
      MONGO_DB: "eloja"
      MONGO_COLLECTION: "ordens"
      Loki__Url: http://loki:3100
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4317
      OTEL_SERVICE_NAME: eloja-ordem-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - eloja-network

  postgres-db:
    build: ./db
    container_name: eloja-pgdb
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-eloja}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - eloja-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: eloja-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dev}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dev}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-definitions.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - eloja-network

  mongodb:
    image: mongo:latest
    container_name: eloja-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin}
      MONGO_INITDB_DATABASE: eloja
    volumes:
      - mongodb_data:/data/db
      - ./mongodb/init-db.js:/docker-entrypoint-initdb.d/init-db.js:ro
    networks:
      - eloja-network

  redis:
    image: redis:7.4-alpine
    container_name: eloja-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - eloja-network

  redis-insight:
    image: redis/redisinsight:latest
    container_name: eloja-redis-insight
    restart: always
    ports:
      - "5540:5540"
    volumes:
      - redis_insight_data:/data
    depends_on:
      - redis
    networks:
      - eloja-network

  prometheus:
    image: prom/prometheus:latest
    container_name: eloja-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-storage:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
    networks:
      - eloja-network

  loki:
    image: grafana/loki:latest
    container_name: eloja-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki-storage:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - eloja-network

  tempo:
    image: grafana/tempo:latest
    container_name: eloja-tempo
    restart: unless-stopped
    user: root
    ports:
      - "3200:3200" # Tempo query API
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo-storage:/var/tempo
    command: -config.file=/etc/tempo.yaml
    networks:
      - eloja-network

  grafana:
    image: grafana/grafana:latest
    container_name: eloja-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - loki
      - prometheus
      - tempo
    networks:
      - eloja-network

volumes:
  pgdata:
  mongodb_data:
  redis_data:
  redis_insight_data:
  rabbitmq_data:
  prometheus-storage:
  loki-storage:
  grafana-storage:
  tempo-storage:

networks:
  eloja-network:
    driver: bridge
